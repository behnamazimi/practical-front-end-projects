<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Game Menu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../13.Game-menu/styles/style.css">
</head>
<body>
    <main class="main-container">
         <h1 id='title'>Generic Game Menu</h1>
     <header>
        <p id="version">v1.5.0</p>
     </header>

     <nav class="menu">
        <button class="btn" id="playBtn" onclick="play()">Play</button>
        <button class="btn" id="optionsBtn" onclick="options()">Options</button>
        <button class="btn" id="creditsBtn" onclick="credits()">Credits</button>
        <button class="btn" id="quitBtn" onclick="quit()">Quit</button>
     </nav>
   </main>
    <footer>
    <p class="footer-text">© 2026 Game Company. All rights reserved.</p>
    </footer>
<script src="../13.Game-menu/scripts/script.js"></script>
</body>
</html>
